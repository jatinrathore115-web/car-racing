<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060912" />
    <title>Apex Velocity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="fade"></div>
    <div id="wipe"><div class="p p1"></div><div class="p p2"></div><div class="p p3"></div></div>
    <!-- source-fallback:start (removed from production builds) -->
    <script>
      // The source entry is TypeScript and only runs through Vite (npm run dev). If this page is opened
      // any other way (VS Code Live Server, double-clicking index.html...), the module fails to load and
      // we jump to the pre-built game in dist/, which runs anywhere, including file://.
      window.__avFallback = function () {
        if (window.__avStarted || window.__avFellBack) return;
        window.__avFellBack = true;
        var go = function () {
          location.replace('dist/index.html');
        };
        var explain = function () {
          document.getElementById('ui').innerHTML =
            '<div style="position:fixed;inset:0;display:grid;place-items:center;background:#060912;color:#f5f7fc;font:16px Manrope,Arial,sans-serif;text-align:center;line-height:1.7;pointer-events:auto">' +
            '<div><b style="font-size:22px">APEX VELOCITY isn’t built yet</b><br>' +
            'Open a terminal in this folder and run <code>npm install</code> then <code>npm run dev</code>,<br>' +
            'or run <code>npm run build</code> once and reload this page.</div></div>';
        };
        // file:// cannot be probed with fetch, so go straight to the build there.
        if (location.protocol === 'file:') return go();
        fetch('dist/index.html', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) {
            r.ok ? go() : explain();
          })
          .catch(go);
      };
    </script>
    <!-- source-fallback:end -->
    <script type="module" src="/src/main.ts" onerror="__avFallback()"></script>
  </body>
</html>
